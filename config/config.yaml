# ============================================================================
# batalex-launcher configuration
#
# This file is copied to ~/.config/batalex-launcher/config.yaml on first run;
# edit that copy. Paths may be absolute, relative to THIS file, or use ~ and
# $ENV_VARS.
# ============================================================================

# ---------------------------------------------------------------------------
# General launcher behaviour
# ---------------------------------------------------------------------------
launcher:
  # Seconds of no input before the screensaver starts (1 minute 30 seconds).
  idle_seconds: 90
  # Hide the mouse cursor after this many seconds without movement.
  cursor_hide_seconds: 3
  # Optional command run by the "Desktop" tile, e.g. a "show desktop" shortcut
  # for your window manager. The launcher then minimizes itself and keeps
  # running (get back via the taskbar or Alt-Tab).
  desktop_command: ""
  # Hide the launcher while an app is running, restore it when the app exits.
  hide_on_launch: true
  restore_on_exit: true
  # What the Escape key does: exit | desktop | none
  esc_action: exit

# ---------------------------------------------------------------------------
# Looks
# ---------------------------------------------------------------------------
appearance:
  background: "#0b0b10"
  text: "#f5f5f7"
  text_dim: "#9a9aa3"
  accent: "#2997ff"
  # Leave empty to auto-pick the best installed sans-serif font.
  font_family: ""
  # App icons are rectangular images (16:9 recommended, >= 640x360) that are
  # drawn as rounded rectangles.
  tile_width: 300
  tile_height: 170
  tile_radius: 26
  focus_zoom: 1.08
  row_label_size: 24
  tile_label_size: 19
  row_spacing: 30
  side_margin: 46

# ---------------------------------------------------------------------------
# The big picture (hero) at the top of the home screen. It uses the
# screensaver media library and shuffles on the same cycle.
# ---------------------------------------------------------------------------
hero:
  enabled: true
  # Fraction of window height used by the hero.
  height_ratio: 0.52
  cycle_seconds: 60
  show_clock: true

# ---------------------------------------------------------------------------
# Screensaver: starts after launcher.idle_seconds of no input, then cycles
# through photos (Ken Burns effect) and muted videos from these folders.
# Any key press, click or mouse movement returns to the launcher.
# ---------------------------------------------------------------------------
screensaver:
  enabled: true
  # How long each photo/video is shown before shuffling to the next one.
  cycle_seconds: 60
  shuffle: true
  show_clock: true
  clock_24h: true
  media_dirs:
    - "../assets/screensaver"
    - "~/Pictures/screensaver"

# Recognised file types (lowercase, with or without the dot).
media:
  image_extensions: [.jpg, .jpeg, .png, .webp, .bmp]
  video_extensions: [.mp4, .m4v, .mov, .mkv, .webm]

# ---------------------------------------------------------------------------
# App rows. Each app needs a rectangular image (icon). `command` is any shell
# command or script. Built-in `action` values: desktop, exit, screensaver.
# ---------------------------------------------------------------------------
rows:
  - title: Apps
    items:
      - name: Terminal
        icon: "../assets/icons/terminal.png"
        command: "x-terminal-emulator || xterm || gnome-terminal || konsole"
      - name: Files
        icon: "../assets/icons/files.png"
        command: "xdg-open ~"
      - name: Web
        icon: "../assets/icons/web.png"
        command: "xdg-open https://www.apple.com"
      - name: Music
        icon: "../assets/icons/music.png"
        command: "xdg-open https://music.apple.com"
      - name: Videos
        icon: "../assets/icons/videos.png"
        command: "vlc --fullscreen || mpv --fs ~/Videos"
      - name: Photos
        icon: "../assets/icons/photos.png"
        command: "xdg-open ~/Pictures"

  - title: System
    items:
      - name: Desktop
        icon: "../assets/icons/desktop.png"
        action: desktop
      - name: Screensaver
        icon: "../assets/icons/screensaver.png"
        action: screensaver
      - name: Settings
        icon: "../assets/icons/settings.png"
        command: "gnome-control-center || systemsettings || xfce4-settings-manager"
      - name: Exit
        icon: "../assets/icons/exit.png"
        action: exit
